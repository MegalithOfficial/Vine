services:
  vine:
    # Make sure to change the tag to the vine version you want to use.
    # https://github.com/Pumpkin-MC/Vine/pkgs/container/vine/versions?filters%5Bversion_type%5D=tagged
    #image: ghcr.io/pumpkin-mc/vine:master
    build: .
    ports:
      - "25565:25565"
      # Only needed when [bedrock] is enabled in vine.toml
      #- "19132:19132/udp"
    volumes:
      - vine-data:/vine
      # To keep the files in ./data instead, the directory must be owned by the container user:
      #   mkdir -p data && sudo chown 2613:2613 data
      #- ./data:/vine
      # Use the following, if you want to make your config immutable
      #- ./vine.toml:/vine/vine.toml:ro
    #environment:
    #  VINE_FORWARDING_SECRET: change-me
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    read_only: false

volumes:
  vine-data:
